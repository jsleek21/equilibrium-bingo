<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equilibrium Bingo — Admin</title>
<style>
  :root{
    --bg:#14181c; --surface:#1c2228; --surface-hi:#242b32; --border:#2c343c;
    --text:#e9e6de; --muted:#8d959d; --accent:#b8863f; --accent-soft:#3a3122;
    --approve:#4f9d69; --approve-soft:#1c2a20; --reject:#c1594a; --reject-soft:#2c1e1c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,sans-serif;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 80px;}
  h1{font-family:Georgia,serif;font-size:28px;margin:6px 0 4px;}
  .sub{color:var(--muted);font-size:13.5px;max-width:70ch;line-height:1.5;}
  .gate{max-width:360px;margin:120px auto;text-align:center;}
  .gate input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;margin-top:14px;}
  .gate button{margin-top:12px;width:100%;padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;}
  .gate button:hover{background:var(--accent);color:#1c1508;}
  .tabs{display:flex;gap:8px;margin:20px 0 16px;border-bottom:1px solid var(--border);}
  .tab{padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-color:var(--accent);}
  .bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 0;margin-bottom:16px;}
  .regions{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .pill{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#1c1508;}
  .stats{display:flex;gap:14px;font-size:13px;color:var(--muted);white-space:nowrap;}
  .stats b{color:var(--text);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .card[data-approved="true"]{border-color:var(--approve);}
  .card[data-obtained="true"]{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)) padding-box, var(--surface);}
  .card-top{display:flex;gap:12px;align-items:center;}
  .thumb{width:56px;height:56px;flex:none;border-radius:8px;background:var(--surface-hi);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .thumb img{max-width:100%;max-height:100%;}
  .thumb .fallback{font-size:9px;color:var(--muted);text-align:center;}
  .item-name{font-size:14px;font-weight:700;line-height:1.3;}
  .item-region{display:inline-block;margin-top:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .item-level{font-size:12px;color:var(--muted);}
  .row{display:flex;gap:6px;}
  .tbtn{flex:1;border:1px solid var(--border);background:var(--surface-hi);color:var(--muted);padding:7px 0;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;}
  .tbtn.approve.on{background:var(--approve);border-color:var(--approve);color:#0d1a12;}
  .tbtn.reject.on{background:var(--reject);border-color:var(--reject);color:#210e0a;}
  .tbtn.obtain.on{background:var(--accent);border-color:var(--accent);color:#1c1508;}
  .empty{color:var(--muted);padding:40px;text-align:center;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="gate" class="gate">
  <h1>Admin access</h1>
  <p class="sub">Enter the admin password to manage items and mark drops.</p>
  <input type="password" id="pw" placeholder="Password">
  <button id="pwBtn">Enter</button>
  <p class="sub" id="pwErr" style="color:#c1594a;display:none;">Wrong password.</p>
</div>

<div id="app" class="wrap" style="display:none;">
  <h1>Equilibrium Bingo — Admin</h1>
  <p class="sub">Approve/reject the item pool, and mark drops obtained — every viewer's card updates live the moment you mark something.</p>

  <div class="tabs">
    <div class="tab active" data-tab="review">Review pool</div>
    <div class="tab" data-tab="drops">Mark drops</div>
  </div>

  <div class="bar">
    <div class="regions" id="regionPills"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://nmwbwclpwvbcenhxfirw.supabase.co";
const SUPABASE_KEY = "sb_publishable_VlC6QzuXAYyKrfF-lf8V0Q_Vh8a-k5-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// NOTE: client-side-only gate, not real auth. Anyone with dev tools open could
// bypass this and write to the DB directly with the public key. Fine for a
// low-stakes community tool; change this password before sharing the link.
const ADMIN_PASSWORD = "equilibrium2026";

const gate = document.getElementById("gate");
const app = document.getElementById("app");
document.getElementById("pwBtn").onclick = tryEnter;
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });
function tryEnter(){
  const val = document.getElementById("pw").value;
  if (val === ADMIN_PASSWORD) {
    sessionStorage.setItem("bingo-admin-ok", "1");
    gate.style.display = "none";
    app.style.display = "block";
    init();
  } else {
    document.getElementById("pwErr").style.display = "block";
  }
}
if (sessionStorage.getItem("bingo-admin-ok") === "1") {
  gate.style.display = "none";
  app.style.display = "block";
  init();
}

let items = [];
let activeRegion = "All";
let activeTab = "review";
const REGION_ORDER = ["Misthalin","Havenhythe","Karamja","Desert","Wilderness","Anachronia"];

document.querySelectorAll(".tab").forEach(t => {
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    activeTab = t.dataset.tab;
    render();
  };
});

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(()=> el.classList.remove("show"), 1800);
}

async function init(){
  await loadItems();
  sb.channel("items-admin")
    .on("postgres_changes", { event: "*", schema: "public", table: "items" }, payload => {
      const idx = items.findIndex(i => i.id === payload.new?.id || i.id === payload.old?.id);
      if (payload.eventType === "DELETE") { if (idx>-1) items.splice(idx,1); }
      else if (idx > -1) items[idx] = payload.new;
      else items.push(payload.new);
      render();
    })
    .subscribe();
  render();
}

async function loadItems(){
  const { data, error } = await sb.from("items").select("*").order("region").order("name");
  if (error) { toast("Load error: " + error.message); return; }
  items = data;
}

function renderPills(){
  const regions = ["All", ...REGION_ORDER.filter(r => items.some(i => i.region === r))];
  const el = document.getElementById("regionPills");
  el.innerHTML = "";
  regions.forEach(r => {
    const p = document.createElement("button");
    p.className = "pill" + (r === activeRegion ? " active" : "");
    p.textContent = r;
    p.onclick = () => { activeRegion = r; render(); };
    el.appendChild(p);
  });
}

function renderStats(){
  const approved = items.filter(i=>i.approved).length;
  const obtained = items.filter(i=>i.obtained).length;
  document.getElementById("stats").innerHTML =
    `<span>Total <b>${items.length}</b></span><span>Approved <b>${approved}</b></span><span>Obtained <b>${obtained}</b></span>`;
}

async function updateItem(id, patch){
  const { data, error } = await sb.from("items").update(patch).eq("id", id).select().single();
  if (error) { toast("Update failed: " + error.message); return; }
  const idx = items.findIndex(i => i.id === id);
  if (idx > -1) items[idx] = data;
  render();
}

function render(){
  renderPills();
  renderStats();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let list = items.filter(i => activeRegion === "All" || i.region === activeRegion);
  if (activeTab === "drops") list = list.filter(i => i.approved);

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty">Nothing here yet.</div>`;
    return;
  }

  list.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.approved = !!item.approved;
    card.dataset.obtained = !!item.obtained;
    const thumb = item.icon
      ? `<img src="${item.icon}" alt="">`
      : `<div class="fallback">no img</div>`;
    card.innerHTML = `
      <div class="card-top">
        <div class="thumb">${thumb}</div>
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-region">${item.region}</div>
          <div class="item-level">${item.level}</div>
        </div>
      </div>
      <div class="row" data-role="review-row" style="${activeTab==='drops' ? 'display:none;' : ''}">
        <button class="tbtn approve ${item.approved ? 'on':''}">Approve</button>
        <button class="tbtn reject ${item.approved===false && item.rejected ? 'on':''}">Reject</button>
      </div>
      <div class="row" data-role="drop-row" style="${activeTab==='review' ? 'display:none;' : ''}">
        <button class="tbtn obtain ${item.obtained ? 'on':''}">${item.obtained ? 'Obtained ✓' : 'Mark obtained'}</button>
      </div>
    `;
    const approveBtn = card.querySelector(".approve");
    const rejectBtn = card.querySelector(".reject");
    const obtainBtn = card.querySelector(".obtain");
    if (approveBtn) approveBtn.onclick = () => updateItem(item.id, { approved: !item.approved });
    if (rejectBtn) rejectBtn.onclick = () => updateItem(item.id, { approved: false });
    if (obtainBtn) obtainBtn.onclick = () => updateItem(item.id, {
      obtained: !item.obtained,
      obtained_at: !item.obtained ? new Date().toISOString() : null
    });
    grid.appendChild(card);
  });
}
</script>
</body>
</html>
