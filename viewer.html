<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equilibrium League Bingo</title>
<style>
  :root{
    --bg:#14181c; --surface:#1c2228; --surface-hi:#242b32; --border:#2c343c;
    --text:#e9e6de; --muted:#8d959d; --accent:#b8863f; --accent-soft:#3a3122;
    --done:#4f9d69; --done-soft:#1c2a20;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",-apple-system,sans-serif;min-height:100vh;}
  .bg-swirl{
    position:fixed; inset:-10%;
    background-image:url('assets/equilibrium-swirl.png');
    background-size:160%; background-position:center;
    opacity:0.42; filter:blur(38px) saturate(1.35);
    transform:scale(1.15); pointer-events:none; z-index:0;
  }
  .bg-fade{
    position:fixed; inset:0;
    background:radial-gradient(ellipse 1000px 600px at 50% 0%, rgba(16,20,15,.35) 0%, rgba(16,20,15,.78) 60%, #10140f 92%);
    pointer-events:none; z-index:0;
  }
  .wrap{max-width:780px;margin:0 auto;padding:32px 20px 80px;text-align:center;position:relative;z-index:1;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  h1{font-family:Georgia,serif;font-size:clamp(26px,4vw,34px);margin:6px 0 18px;}
  .entry{max-width:360px;margin:0 auto 30px;}
  .entry input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;text-align:center;}
  .entry button{margin-top:10px;width:100%;padding:11px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;cursor:pointer;font-size:14.5px;}
  .entry button:hover{background:var(--accent);color:#1c1508;}
  .sub{color:var(--muted);font-size:13.5px;max-width:50ch;margin:0 auto 20px;line-height:1.5;}
  .board-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;text-align:left;}
  .board-head .name{font-weight:800;font-size:17px;}
  .board-head .progress{font-size:12.5px;color:var(--muted);}
  .board-head button{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:7px;font-size:12px;cursor:pointer;}
  .board-head .actions{display:flex;gap:8px;}
  .copyBtn{border-color:var(--accent) !important;color:var(--accent) !important;}
  .board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .sq{aspect-ratio:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:4%;
      transition:all .2s;position:relative;overflow:hidden;container-type:inline-size;}
  .sq.done{border-color:var(--done);background:linear-gradient(var(--done-soft),var(--done-soft)) padding-box, var(--surface);}
  .sq.done::after{content:"✓";position:absolute;top:4px;right:6px;color:var(--done);font-weight:900;font-size:14px;}
  .sq img{width:58cqw;height:58cqw;object-fit:contain;}
  .sq .nm{font-size:11.5cqw;line-height:1.1;font-weight:700;}
  .sq .rg{font-size:7.5cqw;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
  .hidden{display:none;}
  .err{color:#c1594a;font-size:13px;margin-top:8px;}
  footer{margin-top:34px;color:var(--muted);font-size:12px;}

  .recent{margin-top:22px;text-align:left;}
  .recent-head{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;}
  .recent-list{display:flex;flex-direction:column;gap:6px;}
  .recent-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;}
  .recent-row img{width:24px;height:24px;object-fit:contain;flex:none;}
  .recent-row .rname{font-size:13px;font-weight:700;flex:1;}
  .recent-row .rregion{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;}
  .recent-row .rwhen{font-size:11px;color:var(--muted);white-space:nowrap;}

  @keyframes eq-sq-pulse{0%{box-shadow:0 0 0 0 rgba(79,157,105,.6);}70%{box-shadow:0 0 0 14px rgba(79,157,105,0);}100%{box-shadow:0 0 0 0 rgba(79,157,105,0);}}
  @keyframes eq-toast-in{0%{transform:translateY(12px) translateX(-50%);opacity:0;}100%{transform:translateY(0) translateX(-50%);opacity:1;}}
  @keyframes eq-confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:1;}100%{transform:translateY(420px) rotate(360deg);opacity:0;}}
  #toast{
    display:none; position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--done); color:var(--text);
    padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:20; white-space:nowrap;
  }
  #confetti-layer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:19;}
</style>
</head>
<body>
<div class="bg-swirl"></div>
<div class="bg-fade"></div>
<div class="wrap">
  <div class="eyebrow">Equilibrium League · Twitch Bingo</div>
  <h1>Get Your Bingo Card</h1>

  <div id="entry" class="entry">
    <p class="sub">Enter your Twitch username to generate your card. Same username always gets the same card — come back anytime.</p>
    <input id="uname" placeholder="your_twitch_username" autocomplete="off">
    <button id="go">Get my card</button>
    <div class="err hidden" id="err"></div>
  </div>

  <div id="boardWrap" class="hidden">
    <div class="board-head">
      <div>
        <div class="name" id="boardName"></div>
        <div class="progress" id="boardProgress"></div>
      </div>
      <div class="actions">
        <button id="copyBtn" class="copyBtn">Copy my link</button>
        <button id="switchBtn">Different username</button>
      </div>
    </div>
    <div class="board" id="board"></div>

    <div id="recentWrap" class="recent hidden">
      <div class="recent-head">Last drops obtained</div>
      <div id="recentList" class="recent-list"></div>
    </div>
  </div>

  <footer>Squares cross out live the moment Sleek confirms a drop on stream.</footer>
</div>
<div id="confetti-layer"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://nmwbwclpwvbcenhxfirw.supabase.co";
const SUPABASE_KEY = "sb_publishable_VlC6QzuXAYyKrfF-lf8V0Q_Vh8a-k5-";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const BOARD_SIZE = 25; // 5x5

// Deterministic string hash -> 32-bit seed
function hashSeed(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return () => {
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

function seededShuffle(arr, rand){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let approvedItems = [];
let currentCard = null; // { username, layout: [item ids] }
let itemsById = {};
let channel = null;

async function loadApproved(){
  const { data, error } = await sb.from("items").select("*").eq("approved", true);
  if (error) { showErr("Could not load item pool: " + error.message); return; }
  approvedItems = data;
  itemsById = Object.fromEntries(data.map(i => [i.id, i]));
}

function showErr(msg){
  const e = document.getElementById("err");
  e.textContent = msg;
  e.classList.remove("hidden");
}

async function getOrCreateCard(username){
  const key = username.trim().toLowerCase();
  if (!key) { showErr("Enter a username."); return null; }

  const { data: existing, error: selErr } = await sb.from("cards").select("*").eq("username", key).maybeSingle();
  if (selErr) { showErr("Lookup failed: " + selErr.message); return null; }
  if (existing) return existing;

  if (approvedItems.length < BOARD_SIZE) {
    showErr(`Only ${approvedItems.length} approved items so far — need at least ${BOARD_SIZE} to build a card. Check back once more are approved.`);
    return null;
  }

  const rand = hashSeed(key);
  const chosen = seededShuffle(approvedItems, rand).slice(0, BOARD_SIZE);
  const layout = chosen.map(i => i.id);

  const { data: created, error: insErr } = await sb.from("cards")
    .insert({ username: key, layout })
    .select().single();
  if (insErr) { showErr("Could not save card: " + insErr.message); return null; }
  return created;
}

function renderBoard(){
  document.getElementById("boardName").textContent = currentCard.username;
  const board = document.getElementById("board");
  board.innerHTML = "";
  let doneCount = 0;

  currentCard.layout.forEach(id => {
    const item = itemsById[id];
    const sq = document.createElement("div");
    sq.className = "sq";
    sq.dataset.itemId = id;
    if (item?.obtained) { sq.classList.add("done"); doneCount++; }
    sq.innerHTML = item
      ? `${item.icon ? `<img src="${item.icon}" alt="">` : ""}<div class="nm">${item.name}</div><div class="rg">${item.region}</div>`
      : `<div class="nm">(item removed)</div>`;
    board.appendChild(sq);
  });

  document.getElementById("boardProgress").textContent = `${doneCount} / ${currentCard.layout.length} squares complete`;
}

function celebrateSquare(squareEl, itemName, isLastSquare) {
  if (!squareEl) return;
  squareEl.style.animation = 'eq-sq-pulse 1.5s ease';
  setTimeout(() => squareEl.style.animation = '', 1500);
  showToast(isLastSquare ? 'Board complete! Every square confirmed on stream.' : `${itemName} confirmed on stream!`);
  if (isLastSquare) fireConfetti();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  el.style.animation = 'eq-toast-in .3s ease';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.style.display = 'none', 3000);
}

function fireConfetti() {
  const colors = ['#d4a856', '#4f9d69', '#f3ead8', '#7ec98f'];
  const container = document.getElementById('confetti-layer');
  container.innerHTML = '';
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('div');
    const size = 6 + Math.round(Math.random() * 6);
    p.style.cssText = `position:absolute;top:-20px;left:${Math.random()*100}%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};border-radius:${Math.random()>0.5?'50%':'2px'};animation:eq-confetti-fall ${1.8+Math.random()*1.2}s ease-in ${Math.random()*0.6}s forwards;`;
    container.appendChild(p);
  }
  setTimeout(() => container.innerHTML = '', 3200);
}

function catchUpDrops(username, layout, itemsById) {
  const seenKey = `bingo-seen-${username}`;
  const seen = new Set(JSON.parse(localStorage.getItem(seenKey) || '[]'));
  const currentlyObtained = layout.filter(id => itemsById[id]?.obtained);
  const newDrops = currentlyObtained.filter(id => !seen.has(id));
  localStorage.setItem(seenKey, JSON.stringify(currentlyObtained));
  if (newDrops.length === 0) return;

  let i = 0;
  const playNext = () => {
    if (i >= newDrops.length) return;
    const id = newDrops[i];
    const isLast = layout.every(lid => itemsById[lid]?.obtained);
    celebrateSquare(document.querySelector(`[data-item-id="${id}"]`), itemsById[id]?.name, isLast && i === newDrops.length - 1);
    i++;
    setTimeout(playNext, 1900);
  };
  setTimeout(playNext, 500);
}

let recentDrops = [];

function timeAgo(iso){
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function renderRecent(){
  const wrap = document.getElementById("recentWrap");
  const list = document.getElementById("recentList");
  if (recentDrops.length === 0) { wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  list.innerHTML = recentDrops.map(item => `
    <div class="recent-row">
      ${item.icon ? `<img src="${item.icon}" alt="">` : ""}
      <div class="rname">${item.name}</div>
      <div class="rregion">${item.region}</div>
      <div class="rwhen">${item.obtained_at ? timeAgo(item.obtained_at) : ""}</div>
    </div>
  `).join("");
}

async function loadRecentDrops(){
  const { data, error } = await sb.from("items").select("*")
    .eq("obtained", true).order("obtained_at", { ascending: false }).limit(5);
  if (error) return;
  recentDrops = data;
  renderRecent();
}

function subscribeRealtime(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("items-viewer")
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "items" }, payload => {
      const wasObtained = itemsById[payload.new.id]?.obtained;
      itemsById[payload.new.id] = payload.new;

      if (!wasObtained && payload.new.obtained) {
        recentDrops = [payload.new, ...recentDrops.filter(i => i.id !== payload.new.id)].slice(0, 5);
        renderRecent();
      } else if (wasObtained && !payload.new.obtained) {
        recentDrops = recentDrops.filter(i => i.id !== payload.new.id);
        renderRecent();
      } else if (recentDrops.some(i => i.id === payload.new.id)) {
        recentDrops = recentDrops.map(i => i.id === payload.new.id ? payload.new : i);
        renderRecent();
      }

      if (currentCard && currentCard.layout.includes(payload.new.id)) {
        renderBoard();
        if (!wasObtained && payload.new.obtained) {
          const seenKey = `bingo-seen-${currentCard.username}`;
          const seen = new Set(JSON.parse(localStorage.getItem(seenKey) || '[]'));
          seen.add(payload.new.id);
          localStorage.setItem(seenKey, JSON.stringify([...seen]));
          const isLast = currentCard.layout.every(lid => itemsById[lid]?.obtained);
          celebrateSquare(document.querySelector(`[data-item-id="${payload.new.id}"]`), payload.new.name, isLast);
        }
      }
    })
    .subscribe();
}

async function loadFreshItemsById(){
  const ids = currentCard.layout;
  const { data, error } = await sb.from("items").select("*").in("id", ids);
  if (!error) data.forEach(i => { itemsById[i.id] = i; });
}

async function showCard(uname){
  document.getElementById("err").classList.add("hidden");
  await loadApproved();
  const card = await getOrCreateCard(uname);
  if (!card) return false;
  currentCard = card;
  await loadFreshItemsById();
  document.getElementById("entry").classList.add("hidden");
  document.getElementById("boardWrap").classList.remove("hidden");
  renderBoard();
  subscribeRealtime();
  loadRecentDrops();
  catchUpDrops(currentCard.username, currentCard.layout, itemsById);
  localStorage.setItem("bingo-last-username", card.username);
  const url = new URL(location.href);
  url.searchParams.set("u", card.username);
  history.replaceState(null, "", url);
  return true;
}

document.getElementById("go").onclick = () => showCard(document.getElementById("uname").value);

document.getElementById("switchBtn").onclick = () => {
  document.getElementById("boardWrap").classList.add("hidden");
  document.getElementById("entry").classList.remove("hidden");
  if (channel) { sb.removeChannel(channel); channel = null; }
  currentCard = null;
  recentDrops = [];
  document.getElementById("recentWrap").classList.add("hidden");
  const url = new URL(location.href);
  url.searchParams.delete("u");
  history.replaceState(null, "", url);
};

document.getElementById("copyBtn").onclick = () => {
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = document.getElementById("copyBtn");
    const old = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => { btn.textContent = old; }, 1500);
  });
};

document.getElementById("uname").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("go").click();
});

// If a username is in the URL (?u=name), load that card straight away —
// this is what makes shareable links like viewer.html?u=someviewer work.
const urlUname = new URL(location.href).searchParams.get("u");
if (urlUname) {
  document.getElementById("uname").value = urlUname;
  showCard(urlUname);
} else {
  // otherwise auto-resume last username on this device/browser
  const last = localStorage.getItem("bingo-last-username");
  if (last) document.getElementById("uname").value = last;
}
</script>
</body>
</html>
